<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Selection Sort Interactive</title>

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#f5f3ff,#faf5ff);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  overflow:hidden;
  color:#6b21a8;
}

.card{
  width:520px;
  background:#ffffffcc;
  backdrop-filter:blur(12px);
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  position:relative;
}

h1{
  margin-bottom:15px;
}

.progress{
  width:100%;
  height:12px;
  background:#ede9fe;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#c084fc,#8b5cf6);
  transition:0.4s;
}

.numbers{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:30px 0;
}

.num{
  width:55px;
  height:55px;
  line-height:55px;
  border-radius:15px;
  background:#e9d5ff;
  font-weight:700;
  font-size:20px;
  transition:0.3s;
}

.sorted{
  background:#d8b4fe;
}

.current{
  background:#ddd6fe;
  transform:scale(1.1);
}

.min{
  background:#8b5cf6;
  color:white;
  transform:scale(1.2);
  box-shadow:0 0 15px #c084fc;
}

.swap{
  animation:shake 0.4s;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-6px);}
  100%{transform:translateX(0);}
}

.btn{
  padding:12px 22px;
  margin:10px;
  border:none;
  border-radius:15px;
  background:#ddd6fe;
  color:#6b21a8;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
  font-size:16px;
}

.btn:hover{
  transform:translateY(-3px) scale(1.05);
  background:#c4b5fd;
}

.correct{
  color:#16a34a;
  font-weight:700;
}

.wrong{
  color:#dc2626;
  font-weight:700;
}

#explain{
  margin-top:12px;
  background:#faf5ff;
  padding:12px;
  border-radius:12px;
  min-height:45px;
}

.stats{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-weight:700;
}

.badge{
  margin-top:15px;
  font-size:22px;
  font-weight:700;
}

#restart{
  display:none;
  margin-top:20px;
  padding:15px 35px;
}

.confetti{
  position:absolute;
  width:10px;
  height:10px;
  top:-20px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(700px) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="card">

<h1>Selection Sort 💜</h1>

<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<p>Apakah angka ini menjadi minimum baru?</p>

<div class="numbers" id="numbers"></div>

<div id="question"></div>

<div style="margin-top:20px;">
  <button class="btn action" onclick="answer(true)">
    ✅ Ya
  </button>

  <button class="btn action" onclick="answer(false)">
    ❌ Tidak
  </button>
</div>

<div id="status"></div>
<div id="explain"></div>

<div class="stats">
  <div>⭐ Skor: <span id="score">0</span></div>
  <div>🔥 Combo: <span id="combo">0</span></div>
  <div>⏱ <span id="timer">0</span>s</div>
</div>

<div class="badge" id="badge"></div>

<button class="btn" id="restart" onclick="restartGame()">
  Main Lagi
</button>

</div>

<script>

let arr=[];
let i=0;
let j=1;
let minIndex=0;

let totalStep=0;
let correctStep=0;
let combo=0;
let seconds=0;

let timerInterval;

function startTimer(){

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{
    seconds++;
    document.getElementById("timer").innerText=seconds;
  },1000);
}

function playSound(freq){

  const ctx=new(window.AudioContext||window.webkitAudioContext)();

  const osc=ctx.createOscillator();

  osc.type="sine";
  osc.frequency.value=freq;

  osc.connect(ctx.destination);

  osc.start();

  setTimeout(()=>{
    osc.stop();
  },120);
}

function generateArray(){

  let set=new Set();

  while(set.size<6){
    set.add(Math.floor(Math.random()*50));
  }

  arr=Array.from(set);
}

function renderArray(){

  const container=document.getElementById("numbers");

  container.innerHTML="";

  arr.forEach((num,index)=>{

    const div=document.createElement("div");

    div.className="num";

    if(index < i){
      div.classList.add("sorted");
    }

    if(index===j){
      div.classList.add("current");
    }

    if(index===minIndex){
      div.classList.add("min");
    }

    div.innerText=num;

    container.appendChild(div);
  });
}

function updateProgress(){

  const progress=(i/(arr.length-1))*100;

  document.getElementById("progressBar").style.width=
  progress+"%";
}

function showStep(){

  if(i>=arr.length-1){

    document.getElementById("question").innerText=
    "🎉 Array berhasil diurutkan!";

    endGame();

    return;
  }

  renderArray();

  document.getElementById("question").innerText=
  `Apakah ${arr[j]} < ${arr[minIndex]} ?`;
}

function answer(choice){

  let isSmaller=arr[j] < arr[minIndex];

  totalStep++;

  const status=document.getElementById("status");
  const explain=document.getElementById("explain");

  if(choice===isSmaller){

    status.innerHTML=
    `<span class="correct">✔ Jawaban Benar!</span>`;

    correctStep++;
    combo++;

    playSound(700);

    explain.innerHTML=isSmaller
      ? `✨ ${arr[j]} lebih kecil → jadi minimum baru`
      : `✅ ${arr[j]} tidak lebih kecil → minimum tetap`;

  }else{

    status.innerHTML=
    `<span class="wrong">✖ Jawaban Salah!</span>`;

    combo=0;

    playSound(250);

    explain.innerHTML=isSmaller
      ? `Harusnya YA karena ${arr[j]} < ${arr[minIndex]}`
      : `Harusnya TIDAK karena ${arr[j]} >= ${arr[minIndex]}`;
  }

  document.getElementById("score").innerText=
  correctStep;

  document.getElementById("combo").innerText=
  combo;

  if(isSmaller){

    minIndex=j;
  }

  j++;

  if(j>=arr.length){

    [arr[i],arr[minIndex]]=
    [arr[minIndex],arr[i]];

    renderArray();

    document.querySelectorAll(".num")[i]
    .classList.add("swap");

    document.querySelectorAll(".num")[minIndex]
    .classList.add("swap");

    i++;

    minIndex=i;

    j=i+1;
  }

  updateProgress();

  setTimeout(showStep,900);
}

function endGame(){

  clearInterval(timerInterval);

  document.querySelectorAll(".action")
  .forEach(btn=>btn.style.display="none");

  document.getElementById("restart")
  .style.display="inline-block";

  let percent=Math.round((correctStep/totalStep)*100);

  let badge="";

  if(percent===100){

    badge="👑 Selection Sort Master";

  }else if(percent>=80){

    badge="🏆 Hebat!";

  }else{

    badge="✨ Good Try!";
  }

  document.getElementById("badge").innerText=
  badge;

  confetti();
}

function confetti(){

  for(let i=0;i<70;i++){

    let div=document.createElement("div");

    div.className="confetti";

    div.style.left=Math.random()*100+"%";

    div.style.background=
    `hsl(${Math.random()*360},100%,70%)`;

    div.style.animationDuration=
    (Math.random()*2+2)+"s";

    document.body.appendChild(div);

    setTimeout(()=>{
      div.remove();
    },4000);
  }
}

function restartGame(){

  totalStep=0;
  correctStep=0;
  combo=0;
  seconds=0;

  i=0;
  j=1;

  document.getElementById("score").innerText=0;
  document.getElementById("combo").innerText=0;
  document.getElementById("timer").innerText=0;

  document.getElementById("status").innerText="";
  document.getElementById("explain").innerText="";
  document.getElementById("badge").innerText="";

  document.getElementById("progressBar")
  .style.width="0%";

  document.querySelectorAll(".action")
  .forEach(btn=>btn.style.display="inline-block");

  document.getElementById("restart")
  .style.display="none";

  generateArray();

  minIndex=0;

  startTimer();

  showStep();
}

generateArray();

minIndex=0;

startTimer();

showStep();

</script>

</body>
</html>
